spring:
  application:
    name: resource-booking-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resource_booking_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

jwt:
  secret: ${JWT_SECRET:change-this-secret-key-for-local-development-only}
  expiration: ${JWT_EXPIRATION:86400000}